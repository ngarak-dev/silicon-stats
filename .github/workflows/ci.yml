name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # macOS unit tests + compile check (no DMG). Release DMGs are tag-only
  # via release-dmg.yml.
  test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project SiliconStats.xcodeproj \
            -scheme "Silicon Stats" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project SiliconStats.xcodeproj \
            -scheme "Silicon Stats" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
